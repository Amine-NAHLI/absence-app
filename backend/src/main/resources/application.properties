spring.application.name=absence-backend

# ------------------------------------------------------------------------------
# CHARGEMENT AUTOMATIQUE DU FICHIER .ENV (dans backend/ ou à la racine)
# ------------------------------------------------------------------------------
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# ------------------------------------------------------------------------------
# SERVEUR HTTP
# ------------------------------------------------------------------------------
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# BASE DE DONNÉES (Neon PostgreSQL ou H2 local)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-royal-grass-b4xsf3st-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_qLRYiywj4AH6}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# ------------------------------------------------------------------------------
# JPA & HIBERNATE
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# UPLOAD DES JUSTIFICATIFS (Max 5 Mo imposé par le sujet du TP)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:./uploads/justificatifs}

# ------------------------------------------------------------------------------
# SÉCURITÉ & JETONS JWT
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:SuperSecretKeyAbsenceAppUPF2026Gi4SecureAuthKey123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# COMPTE ADMINISTRATEUR PAR DÉFAUT
# ------------------------------------------------------------------------------
