spring.application.name=absence-backend

# ------------------------------------------------------------------------------
# CHARGEMENT AUTOMATIQUE DU FICHIER .ENV (dans backend/ ou à la racine)
# ------------------------------------------------------------------------------
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# ------------------------------------------------------------------------------
# SERVEUR HTTP
# ------------------------------------------------------------------------------
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# BASE DE DONNÉES NEON (PostgreSQL)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:neondb}?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# JPA & HIBERNATE
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# UPLOAD DES JUSTIFICATIFS (Max 5 Mo imposé par le sujet du TP)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:./uploads/justificatifs}

# ------------------------------------------------------------------------------
# SÉCURITÉ & JETONS JWT
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:upf_gl4_super_secret_jwt_key_2026_securisee_min_256_bits_absence_app}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
