spring.application.name=absence-backend

# ------------------------------------------------------------------------------
# CHARGEMENT AUTOMATIQUE DU FICHIER .ENV (dans backend/ ou à la racine)
# ------------------------------------------------------------------------------
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# ------------------------------------------------------------------------------
# SERVEUR HTTP
# ------------------------------------------------------------------------------
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# BASE DE DONNÉES NEON (PostgreSQL) - CHARGÉE STRICTEMENT DEPUIS .ENV SANS DÉFAUT
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# JPA & HIBERNATE
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# UPLOAD DES JUSTIFICATIFS (Max 5 Mo imposé par le sujet du TP)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:./uploads/justificatifs}

# ------------------------------------------------------------------------------
# SÉCURITÉ & JETONS JWT (CHARGÉS STRICTEMENT DEPUIS .ENV SANS DÉFAUT)
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# COMPTE ADMINISTRATEUR PAR DÉFAUT (CHARGÉ STRICTEMENT DEPUIS .ENV SANS DÉFAUT)
# ------------------------------------------------------------------------------
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

